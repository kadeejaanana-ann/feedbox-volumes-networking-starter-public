<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeedBox</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 3rem auto; padding: 0 1rem; color: #172033; }
    h1 { color: #0f766e; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input { flex: 1; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    button { padding: 0.5rem 1rem; background: #0f766e; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.65rem 0; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; }
    .empty { color: #94a3b8; font-style: italic; }
  </style>
</head>
<body>
  <h1>FeedBox</h1>
  <form id="form">
    <input id="input" type="text" placeholder="Leave a message..." required />
    <button type="submit">Send</button>
  </form>
  <ul id="list"></ul>

  <script>
    const API = 'http://localhost:5000';

    async function load() {
      const res = await fetch(`${API}/api/messages`);
      const data = await res.json();
      const list = document.getElementById('list');
      if (!data.length) {
        list.innerHTML = '<li class="empty">No messages yet.</li>';
        return;
      }
      list.innerHTML = data.map(m => `<li>${m.text}</li>`).join('');
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('input').value.trim();
      if (!text) return;
      await fetch(`${API}/api/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      document.getElementById('input').value = '';
      load();
    });

    load();
  </script>
</body>
</html>
