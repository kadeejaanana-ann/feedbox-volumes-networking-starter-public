services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - feedbox_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db

  web:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  feedbox_data:
