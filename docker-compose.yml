services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - db_net

  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - web_net
      - db_net

  web:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - web_net

volumes:
  db_data:

networks:
  web_net:
  db_net: